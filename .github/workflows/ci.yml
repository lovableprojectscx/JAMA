name: JAMA CI - Validación Continua de Arquitectura y Pruebas

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Pruebas Automatizadas y Cobertura (Clean Architecture)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar Aislamiento de Arquitectura Limpia (Clean Architecture)
        run: node --test tests/arquitectura/**/*.test.js

      - name: Ejecutar 128 Pruebas Unitarias de Dominio y Aplicación
        run: npm run test:unit

      - name: Generar Reporte de Cobertura de Código
        run: npm run test:coverage

      - name: Subir Reporte de Cobertura como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-jama
          path: api/coverage/
